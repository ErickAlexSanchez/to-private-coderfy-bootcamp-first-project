<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Card</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container main-container glass-card">
      <div class="container header">
        <div class="profile-photo">
          <div class="profile-photo__image"></div>
        </div>
        <div class="container name">
          <h1 class="user-name">Erick Sánchez</h1>
          <p class="user-title">Software Engineer</p>
        </div>
      </div>
      <div class="container highlights">
        <div class="container">
          <p class="focus-title">+ 150</p>
          <p>Projects</p>
        </div>
        <div class="container">
          <p class="focus-title">+ 8</p>
          <p>Years of experience</p>
        </div>
      </div>
      <button class="neon-button btn-7" id="get-in-touch">
        <span id="get-in-touch__span">Get In Touch</span>
      </button>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
